<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="editor">
  <form id="form" novalidate>
    <div class="row two">
      <label class="field">
        <span>Cliente</span>
        <input id="name" type="text" placeholder="IFCU" autocomplete="off" required>
      </label>
      <label class="field">
        <span>Sucursal o proyecto <em>(opcional)</em></span>
        <input id="location" type="text" placeholder="Sagamore" autocomplete="off">
      </label>
    </div>

    <div class="field">
      <span>Color del lomo</span>
      <div id="swatches" class="swatches" role="radiogroup" aria-label="Color"></div>
    </div>

    <div class="field">
      <span>Links</span>
      <div id="links" class="link-rows"></div>
      <button type="button" id="addLink" class="btn ghost small">+ Agregar link</button>
    </div>

    <details class="import">
      <summary>Pegar texto de Amazing Fields</summary>
      <p class="hint">Pega el texto tal cual. Se detecta cada URL y se usa el texto anterior como nombre.</p>
      <textarea id="importText" rows="5" placeholder="Initial Scan&#10;https://my.matterport.com/show/?m=..."></textarea>
      <button type="button" id="importBtn" class="btn ghost small">Extraer links</button>
    </details>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="actions">
      <button type="button" id="deleteBtn" class="btn danger" hidden>Eliminar cliente</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn" class="btn ghost">Cancelar</button>
      <button type="submit" class="btn primary">Guardar cliente</button>
    </div>
  </form>
  <script src="./js/shared.js"></script>
  <script src="./js/edit.js"></script>
</body>
</html>
