<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body class="editor">
  <form id="form" novalidate>
    <div class="row two">
      <label class="field">
        <span>Client</span>
        <input id="name" type="text" placeholder="IFCU" autocomplete="off" required>
      </label>
      <label class="field">
        <span>Branch or location <em>(optional)</em></span>
        <input id="location" type="text" placeholder="Sagamore" autocomplete="off">
      </label>
    </div>

    <div class="field">
      <span>Spine color</span>
      <div id="swatches" class="swatches" role="radiogroup" aria-label="Spine color"></div>
    </div>

    <div class="field">
      <span>Main image <em>(optional)</em></span>
      <div class="cover-field">
        <div id="coverPreview" class="cover-preview drop" tabindex="0" role="button"
             aria-label="Drop an image here or click to choose a file"></div>
        <input id="fileInput" type="file" accept="image/*" hidden>
        <div class="cover-inputs">
          <input id="image" type="url" placeholder="https://… direct link to a .jpg or .png" autocomplete="off">
          <div class="cover-buttons">
            <button type="button" id="pickAttachment" class="btn ghost small">Choose from card attachments</button>
            <button type="button" id="clearImage" class="btn ghost small" hidden>Remove image</button>
          </div>
          <div id="attachments" class="attachments" hidden></div>
          <div id="connect" class="connect" hidden>
            <p class="hint">To upload images, connect this Power-Up to your Trello account once.</p>
            <button type="button" id="connectBtn" class="btn primary small">Connect to Trello</button>
          </div>
        </div>
      </div>
    </div>

    <div class="field">
      <span>Links</span>
      <div id="links" class="link-rows"></div>
      <div class="cover-buttons">
        <button type="button" id="addLink" class="btn ghost small">+ Add link</button>
        <button type="button" id="pickFiles" class="btn ghost small">+ Add from card attachments</button>
      </div>
      <div id="filePicker" class="file-picker" hidden></div>
    </div>

    <details class="import">
      <summary>Paste text from Amazing Fields</summary>
      <p class="hint">Paste the text as is. Each URL is detected and the text before it becomes its name.</p>
      <textarea id="importText" rows="5" placeholder="Initial Scan&#10;https://my.matterport.com/show/?m=..."></textarea>
      <button type="button" id="importBtn" class="btn ghost small">Extract links</button>
    </details>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="actions">
      <button type="button" id="deleteBtn" class="btn danger" hidden>Delete project</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn" class="btn ghost">Cancel</button>
      <button type="submit" class="btn primary">Save project</button>
    </div>
  </form>
  <script src="./js/shared.js"></script>
  <script src="./js/edit.js"></script>
</body>
</html>
